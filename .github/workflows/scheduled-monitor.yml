name: Scheduled Monitor — Regression Check

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  monitor:
    name: Monitor Live Site
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Create artifact directories
        run: |
          mkdir -p artifacts/screenshots
          mkdir -p artifacts/stacktraces
          mkdir -p artifacts/logs
          mkdir -p artifacts/bug_reports

      - name: Wait for live site
        env:
          APP_URL: ${{ secrets.RENDER_APP_URL }}
        run: |
          echo "Checking live site at $APP_URL..."
          for i in $(seq 1 30); do
            if curl -sf "$APP_URL/health" > /dev/null; then
              echo "✅ Live site ready"
              break
            fi
            echo "  attempt $i — waiting..."
            sleep 2
          done

      - name: Run scheduled test suite against LIVE site
        continue-on-error: true
        env:
          APP_URL: ${{ secrets.RENDER_APP_URL }}
          DISPLAY: ":99"
        run: pytest tests/ -v --tb=short 2>&1 | tee test_output.txt

      - name: Run bug reporter agent
        if: always()
        env:
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL:          llama-3.3-70b-versatile
          JIRA_BASE_URL:       ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL:          ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN:      ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY:    ${{ secrets.JIRA_PROJECT_KEY }}
          JIRA_SEVERITY_FIELD: ${{ secrets.JIRA_SEVERITY_FIELD }}
          SMTP_SERVER:         smtp.gmail.com
          SMTP_PORT:           "587"
          SMTP_USERNAME:       ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD:       ${{ secrets.SMTP_PASSWORD }}
          FROM_EMAIL:          ${{ secrets.SMTP_USERNAME }}
          REDIS_URL:           redis://localhost:6379/0
          APP_URL:             ${{ secrets.RENDER_APP_URL }}
          GITHUB_ACTOR:        ${{ github.actor }}
        run: python main.py

      - name: Upload monitor artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-${{ github.run_number }}
          path: |
            artifacts/
            test_output.txt
          retention-days: 7
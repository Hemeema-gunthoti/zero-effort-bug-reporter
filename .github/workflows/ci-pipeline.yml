name: CI Pipeline

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  # ─── STEP 1: Build & Test (must pass before anything else) ───
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    outputs:
      tests_passed: ${{ steps.test_result.outputs.passed }}
      failure_summary: ${{ steps.test_result.outputs.summary }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-json-report

      - name: Run tests
        id: run_tests
        continue-on-error: true
        run: |
          pytest tests/ \
            --json-report \
            --json-report-file=test_results.json \
            -v 2>&1 | tee test_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Parse test results
        id: test_result
        run: |
          if python -c "
          import json, sys
          with open('test_results.json') as f:
              r = json.load(f)
          passed = r['summary'].get('passed', 0)
          failed = r['summary'].get('failed', 0)
          total  = r['summary'].get('total',  0)
          summary = f'{passed}/{total} tests passed'
          if failed > 0:
              # Collect failed test names + short error
              fails = []
              for t in r.get('tests', []):
                  if t['outcome'] == 'failed':
                      name = t['nodeid']
                      msg  = t.get('call', {}).get('longrepr', '')[:300]
                      fails.append(f'{name}: {msg}')
              print('FAILED_TESTS=' + '|||'.join(fails))
              print('SUMMARY=' + summary)
              sys.exit(1)
          print('SUMMARY=' + summary)
          "; then
            echo "passed=true"  >> $GITHUB_OUTPUT
          else
            echo "passed=false" >> $GITHUB_OUTPUT
          fi
          echo "summary=$(python -c "
          import json
          with open('test_results.json') as f: r=json.load(f)
          p=r['summary'].get('passed',0); t=r['summary'].get('total',0)
          print(f'{p}/{t} tests passed')
          ")" >> $GITHUB_OUTPUT

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test_results.json
            test_output.txt

  # ─── STEP 2: Notify user via email (runs only after build-and-test) ───
  notify-user:
    name: Send Bug Report Email
    needs: build-and-test
    runs-on: ubuntu-latest
    # Always notify — even if tests passed, so user knows status
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          name: test-results
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install notifier deps
        run: pip install python-dotenv requests

      - name: Send notification email
        env:
          SMTP_HOST:        ${{ secrets.SMTP_HOST }}
          SMTP_PORT:        ${{ secrets.SMTP_PORT }}
          SMTP_USER:        ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:    ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL:     ${{ secrets.NOTIFY_EMAIL }}
          GITHUB_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
          REPO:             ${{ github.repository }}
          BRANCH:           ${{ github.ref_name }}
          COMMIT_SHA:       ${{ github.sha }}
          RUN_ID:           ${{ github.run_id }}
          TESTS_PASSED:     ${{ needs.build-and-test.outputs.tests_passed }}
          FAILURE_SUMMARY:  ${{ needs.build-and-test.outputs.failure_summary }}
          # Webhook URL hosted on your server / Render that handles button clicks
          WEBHOOK_BASE_URL: ${{ secrets.WEBHOOK_BASE_URL }}
        run: |
          python notifications/email_notifier.py

  # ─── STEP 3: AI Fix (triggered ONLY after build-and-test fails + user picks AI Fix) ───
  # This job does NOT run automatically — it is dispatched by the webhook handler
  # See .github/workflows/ai-fix.yml for the dispatch-triggered workflow
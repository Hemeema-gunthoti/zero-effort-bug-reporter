<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login — Bug Reporter Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
      padding: 2.5rem 2rem;
      width: 360px;
    }
    h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 1.5rem; }
    label { display: block; font-size: .85rem; color: #555; margin-bottom: .3rem; }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: .6rem .8rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: .95rem;
      margin-bottom: 1rem;
    }
    button {
      width: 100%;
      padding: .7rem;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
    }
    /*
      BUG: #error-message and #validation-error are always display:none.
      The JS fetch handler below never sets them to display:block.
      This is what makes the Selenium tests fail.
    */
    #error-message, #validation-error {
      display: none;
      color: #dc2626;
      font-size: .85rem;
      margin-top: .5rem;
      padding: .5rem .75rem;
      background: #fef2f2;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sign in</h1>

    <label for="username">Username</label>
    <input type="text" id="username" placeholder="admin" />

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="••••••••" />

    <div id="error-message">Invalid credentials. Please try again.</div>
    <div id="validation-error">Please fill in all fields.</div>

    <button id="login-btn" onclick="doLogin()">Sign in</button>
  </div>

  <script>
    async function doLogin() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      if (!username || !password) {
        // BUG: should do: document.getElementById('validation-error').style.display = 'block'
        console.warn('Validation: empty fields');
        return;
      }

      const form = new FormData();
      form.append('username', username);
      form.append('password', password);

      const res  = await fetch('/login', { method: 'POST', body: form });
      const data = await res.json();

      if (res.ok && data.status === 'success') {
        window.location.href = data.redirect;
      } else {
        // BUG: should do: document.getElementById('error-message').style.display = 'block'
        console.error('Login failed:', data.message);
      }
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  </script>
</body>
</html>

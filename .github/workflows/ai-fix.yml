name: AI Fix & Auto-Merge

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch with failing tests"
        required: true
        default: "main"
      commit_sha:
        description: "Commit SHA that failed"
        required: true
      run_id:
        description: "Original failing run ID"
        required: true
      notify_email:
        description: "Email to notify after AI fix"
        required: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  ai-fix:
    name: AI Agent — Analyze & Fix
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-json-report groq python-dotenv

      - name: Download original test results
        uses: dawidd6/action-download-artifact@v6
        with:
          run_id: ${{ github.event.inputs.run_id }}
          name: test-results
          path: original_results/
        continue-on-error: true

      - name: Run AI Fix Agent
        env:
          GROQ_API_KEY:   ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL:     ${{ secrets.GROQ_MODEL }}
          ORIGINAL_RUN_ID: ${{ github.event.inputs.run_id }}
        run: |
          python agent/ai_fix_agent.py \
            --test-results original_results/test_results.json \
            --repo-path .

      - name: Configure git identity
        run: |
          git config user.name  "Zero-Effort Bot"
          git config user.email "bot@zero-effort.dev"

      - name: Commit AI fixes
        id: commit_fix
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "no_changes=true" >> $GITHUB_OUTPUT
            echo "No changes made by AI agent"
          else
            git commit -m "fix: AI agent auto-fix for run ${{ github.event.inputs.run_id }}"
            git push origin HEAD:${{ github.event.inputs.branch }}
            echo "no_changes=false" >> $GITHUB_OUTPUT
          fi

  # ─── STEP 4: Re-run Build & Test after AI fix ───
  validate-fix:
    name: Build & Test (Post-Fix Validation)
    needs: ai-fix
    runs-on: ubuntu-latest

    outputs:
      tests_passed: ${{ steps.retest.outputs.passed }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-json-report

      - name: Run tests again
        id: retest
        run: |
          pytest tests/ \
            --json-report \
            --json-report-file=post_fix_results.json \
            -v 2>&1 | tee post_fix_output.txt
          if [ $? -eq 0 ]; then
            echo "passed=true" >> $GITHUB_OUTPUT
          else
            echo "passed=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload post-fix test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-fix-test-results
          path: |
            post_fix_results.json
            post_fix_output.txt

  # ─── STEP 5: Merge into main ONLY if all tests pass ───
  merge-to-main:
    name: Auto-Merge to Main
    needs: validate-fix
    runs-on: ubuntu-latest
    if: needs.validate-fix.outputs.tests_passed == 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "Zero-Effort Bot"
          git config user.email "bot@zero-effort.dev"

      - name: Merge into main
        run: |
          git checkout main
          git pull origin main
          git merge --no-ff ${{ github.event.inputs.branch }} \
            -m "chore: Auto-merge AI fix from ${{ github.event.inputs.branch }}"
          git push origin main

      - name: Send success email
        if: always()
        env:
          SMTP_HOST:     ${{ secrets.SMTP_HOST }}
          SMTP_PORT:     ${{ secrets.SMTP_PORT }}
          SMTP_USER:     ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL:  ${{ secrets.NOTIFY_EMAIL }}
          REPO:          ${{ github.repository }}
          BRANCH:        ${{ github.event.inputs.branch }}
          COMMIT_SHA:    ${{ github.event.inputs.commit_sha }}
          RUN_ID:        ${{ github.run_id }}
          TESTS_PASSED:  "true"
          FAILURE_SUMMARY: ""
          WEBHOOK_BASE_URL: ${{ secrets.WEBHOOK_BASE_URL }}
          EMAIL_MODE:    "ai_fix_success"
        run: |
          pip install python-dotenv
          python notifications/email_notifier.py

  # ─── STEP 5b: Notify failure if post-fix tests still fail ───
  notify-fix-failed:
    name: Notify AI Fix Failed
    needs: validate-fix
    runs-on: ubuntu-latest
    if: needs.validate-fix.outputs.tests_passed == 'false'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send failure email
        env:
          SMTP_HOST:     ${{ secrets.SMTP_HOST }}
          SMTP_PORT:     ${{ secrets.SMTP_PORT }}
          SMTP_USER:     ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL:  ${{ secrets.NOTIFY_EMAIL }}
          REPO:          ${{ github.repository }}
          BRANCH:        ${{ github.event.inputs.branch }}
          COMMIT_SHA:    ${{ github.event.inputs.commit_sha }}
          RUN_ID:        ${{ github.run_id }}
          TESTS_PASSED:  "false"
          FAILURE_SUMMARY: "AI fix was applied but tests still fail. Manual intervention required."
          WEBHOOK_BASE_URL: ${{ secrets.WEBHOOK_BASE_URL }}
          EMAIL_MODE:    "ai_fix_failed"
        run: |
          pip install python-dotenv
          python notifications/email_notifier.py
name: CI — Zero-Effort Bug Reporter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      deploy_url: ${{ steps.get_url.outputs.url }}
    
    steps:
      - name: Trigger Render Deploy
        env:
          deploy_url: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "🚀 Triggering Render deployment..."
          curl -X POST "$deploy_url"
          echo "✅ Deploy triggered"

      - name: Wait for Render deploy to complete
        run: |
          echo "⏳ Waiting for Render to build and start..."
          sleep 60
          echo "✅ Deploy should be live"

      - name: Get Render URL
        id: get_url
        run: |
          echo "url=https://bug-reporter-demo.onrender.com" >> $GITHUB_OUTPUT

  test-and-report:
    name: Test Against Live Site
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Create artifact directories
        run: |
          mkdir -p artifacts/screenshots
          mkdir -p artifacts/stacktraces
          mkdir -p artifacts/logs
          mkdir -p artifacts/bug_reports

      - name: Wait for live site to be ready
        env:
          APP_URL: ${{ needs.deploy.outputs.deploy_url }}
        run: |
          echo "Waiting for live site at $APP_URL..."
          for i in $(seq 1 60); do
            if curl -sf "$APP_URL/health" > /dev/null; then
              echo "✅ Live site is up"
              break
            fi
            echo "  attempt $i — waiting..."
            sleep 2
          done

      - name: Run test suite against LIVE site
        continue-on-error: true
        env:
          APP_URL: ${{ needs.deploy.outputs.deploy_url }}
          DISPLAY: ":99"
        run: pytest tests/ -v --tb=short 2>&1 | tee test_output.txt

      - name: Show captured artifacts
        if: always()
        run: |
          echo "=== Failure JSONs ==="
          ls -la artifacts/ || echo "empty"
          echo "=== Screenshots ==="
          ls -la artifacts/screenshots/ || echo "empty"
          echo "=== Stack traces ==="
          ls -la artifacts/stacktraces/ || echo "empty"

      - name: Run bug reporter agent
        if: always()
        env:
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL:          llama-3.3-70b-versatile
          JIRA_BASE_URL:       ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL:          ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN:      ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY:    ${{ secrets.JIRA_PROJECT_KEY }}
          JIRA_SEVERITY_FIELD: ${{ secrets.JIRA_SEVERITY_FIELD }}
          SMTP_SERVER:         smtp.gmail.com
          SMTP_PORT:           "587"
          SMTP_USERNAME:       ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD:       ${{ secrets.SMTP_PASSWORD }}
          FROM_EMAIL:          ${{ secrets.SMTP_USERNAME }}
          REDIS_URL:           redis://localhost:6379/0
          APP_URL:             ${{ needs.deploy.outputs.deploy_url }}
          GITHUB_ACTOR:        ${{ github.actor }}
          GIT_AUTHOR_EMAIL:    ${{ github.event.pusher.email }}
        run: python main.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ github.run_number }}
          path: |
            artifacts/
            test_output.txt
          retention-days: 30

  test-pr:
    name: PR Tests (Local)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Create artifact directories
        run: |
          mkdir -p artifacts/screenshots
          mkdir -p artifacts/stacktraces
          mkdir -p artifacts/logs
          mkdir -p artifacts/bug_reports

      - name: Start Flask app locally
        run: python app/main.py &

      - name: Wait for local Flask
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/health > /dev/null; then
              echo "✅ Flask is up"
              break
            fi
            echo "  attempt $i — waiting..."
            sleep 1
          done

      - name: Run test suite (local)
        continue-on-error: true
        env:
          APP_URL: http://localhost:5000
          DISPLAY: ":99"
        run: pytest tests/ -v --tb=short 2>&1 | tee test_output.txt

      - name: Run bug reporter agent
        if: always()
        env:
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL:          llama-3.3-70b-versatile
          JIRA_BASE_URL:       ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL:          ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN:      ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY:    ${{ secrets.JIRA_PROJECT_KEY }}
          JIRA_SEVERITY_FIELD: ${{ secrets.JIRA_SEVERITY_FIELD }}
          SMTP_SERVER:         smtp.gmail.com
          SMTP_PORT:           "587"
          SMTP_USERNAME:       ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD:       ${{ secrets.SMTP_PASSWORD }}
          FROM_EMAIL:          ${{ secrets.SMTP_USERNAME }}
          REDIS_URL:           redis://localhost:6379/0
          APP_URL:             http://localhost:5000
          GITHUB_ACTOR:        ${{ github.actor }}
          GIT_AUTHOR_EMAIL:    ${{ github.event.pusher.email }}
        run: python main.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-test-artifacts-${{ github.run_number }}
          path: |
            artifacts/
            test_output.txt
          retention-days: 7
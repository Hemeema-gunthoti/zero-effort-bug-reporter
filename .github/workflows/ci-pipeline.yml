name: CI/CD — Test-First Gated Deploy with Human Approval

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: 'Manual action'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - approve-ai-fix
          - reject-ai-fix
          - rollback-production

env:
  PYTHON_VERSION: "3.11"

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # ═════════════════════════════════════════════════════════════════
  # JOB 1: BUILD & TEST — THE GATEKEEPER
  # Skipped when AI Fix Bot merges to avoid re-triggering bug reporter
  # on already-fixed code.
  # ═════════════════════════════════════════════════════════════════
  build-and-test:
    name: 🔨 Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.event_name == 'push' &&
      github.event.head_commit.author.name != 'AI Fix Bot'
    outputs:
      tests_passed: ${{ steps.test_result.outputs.passed }}
      has_failures: ${{ steps.test_result.outputs.has_failures }}
      run_id: ${{ github.run_id }}

    services:
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Setup ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Prepare directories
        run: mkdir -p artifacts/{screenshots,stacktraces,logs,bug_reports,ai_fixes}

      - name: Start Flask app
        run: |
          echo "=== Python version ==="
          python --version
          echo "=== Check app/main.py exists ==="
          ls -la app/main.py
          echo "=== Check templates ==="
          ls -la app/templates/ 2>/dev/null || echo "No templates dir"
          echo "=== Check requirements ==="
          pip list | grep -i flask
          echo "=== Ensure port 5000 is free before starting ==="
          fuser -k 5000/tcp 2>/dev/null || true
          pkill -f "python.*app/main.py" 2>/dev/null || true
          sleep 1
          echo "=== Syntax check ==="
          python -m py_compile app/main.py && echo "✅ No syntax errors" || echo "❌ Syntax error"
          echo "=== Import check ==="
          python -c "import sys; sys.path.insert(0,'.'); sys.path.insert(0,'app'); import main" 2>&1 || echo "❌ Import of app/main.py failed"
          echo "=== Start Flask ==="
          python -u app/main.py > flask.log 2>&1 &
          echo "FLASK_PID=$!" >> $GITHUB_ENV
          sleep 5
          echo "=== Check process ==="
          ps aux | grep -E "python.*main" | grep -v grep || echo "No main.py process"
          echo "=== Check logs ==="
          cat flask.log 2>/dev/null || echo "No log file"
          echo "=== Check port ==="
          ss -tlnp 2>/dev/null | grep 5000 || netstat -tlnp 2>/dev/null | grep 5000 || echo "Port 5000 not listening"

      - name: Wait for Flask healthy
        run: |
          for i in {1..30}; do
            HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:5000/health 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Flask ready"
              exit 0
            fi
            echo "⏳ Waiting... ($i/30) HTTP: $HTTP_CODE"
            sleep 1
          done
          echo "❌ Flask failed"
          echo "=== Full Flask logs ==="
          cat flask.log 2>/dev/null || echo "No logs"
          echo "=== All python processes ==="
          ps aux | grep python || true
          exit 1

      - name: Run test suite
        id: pytest
        continue-on-error: true
        env:
          APP_URL: http://localhost:5000
          DISPLAY: ":99"
        run: |
          pytest tests/ -v --tb=short \
            --json-report --json-report-file=artifacts/test_report.json \
            2>&1 | tee artifacts/test_output.txt

      - name: Check templates exist
        run: |
          ls -la app/templates/ || echo "❌ templates directory missing"
          ls -la app/templates/*.html || echo "❌ No HTML templates found"

      - name: Analyze results
        id: test_result
        run: |
          if [ -f "artifacts/test_report.json" ]; then
            FAILED=$(python -c "import json; d=json.load(open('artifacts/test_report.json')); print(d.get('summary',{}).get('failed',1))")
            PASSED=$(python -c "import json; d=json.load(open('artifacts/test_report.json')); print(d.get('summary',{}).get('passed',0))")
            if [ "$FAILED" -eq 0 ] && [ "$PASSED" -gt 0 ]; then
              echo "passed=true" >> $GITHUB_OUTPUT
              echo "has_failures=false" >> $GITHUB_OUTPUT
              echo "✅ All $PASSED tests passed"
            else
              echo "passed=false" >> $GITHUB_OUTPUT
              echo "has_failures=true" >> $GITHUB_OUTPUT
              echo "❌ $FAILED tests failed"
            fi
          else
            if grep -q "passed" artifacts/test_output.txt && ! grep -qE "(failed|error)" artifacts/test_output.txt; then
              echo "passed=true" >> $GITHUB_OUTPUT
              echo "has_failures=false" >> $GITHUB_OUTPUT
            else
              echo "passed=false" >> $GITHUB_OUTPUT
              echo "has_failures=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ github.run_id }}
          path: artifacts/
          retention-days: 7

      - name: Cleanup Flask
        if: always()
        run: kill $FLASK_PID 2>/dev/null || true

  # ═════════════════════════════════════════════════════════════════
  # JOB 2A: DEPLOY PIPELINE (Tests Passed)
  # ═════════════════════════════════════════════════════════════════
  deploy-staging:
    name: 🚀 Deploy to Staging
    needs: build-and-test
    if: needs.build-and-test.outputs.tests_passed == 'true'
    runs-on: ubuntu-latest
    outputs:
      deploy_status: ${{ steps.verify.outputs.status }}

    steps:
      - name: Trigger Staging Deploy
        run: |
          echo "🚀 Deploying to STAGING..."
          curl -X POST "${{ secrets.RENDER_STAGING_DEPLOY_HOOK_URL }}"
          echo "✅ Triggered"

      - name: Wait for build
        run: sleep 45

      - name: Verify staging health
        id: verify
        run: |
          for i in {1..30}; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${{ secrets.RENDER_STAGING_URL }}/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "status=success" >> $GITHUB_OUTPUT
              echo "✅ Staging healthy"
              exit 0
            fi
            sleep 2
          done
          echo "status=failed" >> $GITHUB_OUTPUT
          echo "❌ Staging health check failed"

  deploy-production:
    name: 🌐 Promote to Production
    needs: deploy-staging
    if: needs.deploy-staging.outputs.deploy_status == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Promote to production
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "✅ Production deploy triggered"

      - name: Wait and verify production
        run: |
          sleep 60
          for i in {1..30}; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${{ secrets.RENDER_APP_URL }}/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Production healthy"
              exit 0
            fi
            sleep 2
          done
          echo "❌ Production health check failed" && exit 1

      - name: Notify success
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          FROM_EMAIL: ${{ secrets.SMTP_USERNAME }}
          TO_EMAIL: ${{ github.event.pusher.email || secrets.SMTP_USERNAME }}
        run: |
          python -c "
          import smtplib
          from email.mime.text import MIMEText
          msg = MIMEText('✅ Successfully deployed to production!\nURL: ${{ secrets.RENDER_APP_URL }}')
          msg['Subject'] = '✅ Deploy Success - Production Live'
          msg['From'] = '${{ secrets.SMTP_USERNAME }}'
          msg['To'] = '${{ secrets.SMTP_USERNAME }}'
          with smtplib.SMTP('smtp.gmail.com', 587) as s:
            s.starttls()
            s.login('${{ secrets.SMTP_USERNAME }}', '${{ secrets.SMTP_PASSWORD }}')
            s.send_message(msg)
          print('📧 Success email sent')
          "

  # ═════════════════════════════════════════════════════════════════
  # JOB 2B: BUG REPORT + AI FIX (Tests Failed)
  # ═════════════════════════════════════════════════════════════════
  bug-report-and-fix:
    name: 🐛 Bug Report + AI Fix
    needs: build-and-test
    if: needs.build-and-test.outputs.tests_passed == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      jira_ticket: ${{ steps.bug_report.outputs.ticket_key }}
      jira_tickets: ${{ steps.bug_report.outputs.ticket_keys }}
      ai_fix_created: ${{ steps.ai_fix.outputs.fix_created }}
      pr_number: ${{ steps.create_pr.outputs.pr_number }}
      pr_url: ${{ steps.create_pr.outputs.pr_url }}
      pr_branch: ${{ steps.create_pr.outputs.pr_branch }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          name: test-artifacts-${{ github.run_id }}
          path: artifacts/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Clear stale dedup cache
        run: rm -f artifacts/dedup_cache.json

      # ── Step 1: Bug Reporter ─────────────────────────────────────
      - name: Run Bug Reporter Agent
        id: bug_report
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL || 'llama-3.3-70b-versatile' }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          JIRA_SEVERITY_FIELD: ${{ secrets.JIRA_SEVERITY_FIELD }}
          SMTP_SERVER: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          FROM_EMAIL: ${{ secrets.SMTP_USERNAME }}
          APP_URL: http://localhost:5000
          GITHUB_ACTOR: ${{ github.actor }}
          GIT_AUTHOR_EMAIL: ${{ github.event.pusher.email }}
          ENABLE_AI_FIX: "false"
          FIX_MODE: propose-only
        run: |
          python main.py

          if [ -f "$GITHUB_ENV" ]; then
            TICKET=$(grep '^JIRA_TICKET=' "$GITHUB_ENV" 2>/dev/null | cut -d'=' -f2 || echo "")
            TICKETS=$(grep '^JIRA_TICKETS=' "$GITHUB_ENV" 2>/dev/null | cut -d'=' -f2 || echo "")
          else
            TICKET=""
            TICKETS=""
          fi

          if [ -z "$TICKET" ]; then
            TICKET=$(ls artifacts/bug_reports/ 2>/dev/null | head -1 | grep -oE '[A-Z]+-[0-9]+' || echo "UNKNOWN")
          fi

          echo "ticket_key=$TICKET" >> $GITHUB_OUTPUT
          echo "ticket_keys=$TICKETS" >> $GITHUB_OUTPUT
          echo "🎫 Jira ticket(s): $TICKETS"
          echo "🎫 Primary ticket: $TICKET"

      - name: Upload Bug Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bug-reports-${{ github.run_id }}
          path: |
            artifacts/bug_reports/
            artifacts/dedup_cache.json
          retention-days: 7

      # ── Step 2: AI Fix Agent (batch — all bugs in one LLM call) ──
      - name: Run AI Fix Agent
        id: ai_fix
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL || 'llama-3.3-70b-versatile' }}
          FIX_MODE: propose-only
        run: |
          python -c "
          import sys, os, glob
          sys.path.insert(0, '.')
          from agent.ai_fix_agent import AIFixAgent

          agent = AIFixAgent()
          bug_report_files = sorted(glob.glob('artifacts/bug_reports/bug_report_*.json'))
          print(f'Found {len(bug_report_files)} bug reports — processing as single batch')

          fix_applied = False
          if bug_report_files:
              try:
                  result = agent.propose_fix_batch(bug_report_files, mode='propose-only')
                  print(f'Batch result: bugs_addressed={result.get(\"bugs_addressed\", \"?\")}, fixed={result.get(\"fixed\")}')
                  if result.get('fixed'):
                      fix_applied = True
              except Exception as e:
                  print(f'Error in batch fix: {e}')
                  import traceback
                  traceback.print_exc()

          if fix_applied:
              os.makedirs('artifacts/ai_fixes', exist_ok=True)
              with open('artifacts/ai_fixes/fix_applied.txt', 'w') as f:
                  f.write('fix_proposed')
              print('Fix marker created')
          "

          if [ -f "artifacts/ai_fixes/fix_applied.txt" ]; then
            echo "fix_created=true" >> $GITHUB_OUTPUT
          else
            echo "fix_created=false" >> $GITHUB_OUTPUT
          fi

      # ── Step 3: Create PR ─────────────────────────────────────────
      - name: Create AI Fix PR
        id: create_pr
        if: steps.ai_fix.outputs.fix_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git

          BRANCH="ai-fix-${{ github.run_id }}"
          git config user.name "AI Fix Bot"
          git config user.email "ai-fix@bot.com"
          git checkout -b "$BRANCH"

          TOUCHED_TESTS="false"
          if [ -f artifacts/ai_fixes/fix_manifest.json ]; then
            python3 -c "
          import json, shutil, os
          manifest = json.load(open('artifacts/ai_fixes/fix_manifest.json'))
          touched_tests = False
          for orig_path, fix_filename in manifest.items():
              fix_path = os.path.join('artifacts/ai_fixes', fix_filename)
              if not os.path.exists(fix_path):
                  continue
              if not (orig_path.startswith('app/') or orig_path.startswith('tests/')):
                  print(f'Skipping unexpected path: {orig_path}')
                  continue
              os.makedirs(os.path.dirname(orig_path) or '.', exist_ok=True)
              shutil.copy(fix_path, orig_path)
              print(f'Applied fix to {orig_path}')
              if orig_path.startswith('tests/'):
                  touched_tests = True
          open('touched_tests.flag', 'w').write('true' if touched_tests else 'false')
          "
            git add -A -- app tests 2>/dev/null || true
            [ -f touched_tests.flag ] && TOUCHED_TESTS=$(cat touched_tests.flag)
            rm -f touched_tests.flag
          fi
          echo "TOUCHED_TESTS=$TOUCHED_TESTS" >> $GITHUB_ENV

          echo "=== Staged files ==="
          git diff --cached --name-only

          REVIEW_NOTE=""
          if [ "$TOUCHED_TESTS" = "true" ]; then
            REVIEW_NOTE="
          ### ⚠️ This fix modifies test file(s)
          The agent determined the bug was in test data, not application code. Review the test diff carefully — confirm it only corrects a factual input value, and doesn't loosen or remove any assertion."
          fi

          # Build ticket display — all tickets comma-separated
          TICKET_DISPLAY="${{ steps.bug_report.outputs.ticket_keys }}"
          if [ -z "$TICKET_DISPLAY" ]; then
            TICKET_DISPLAY="${{ steps.bug_report.outputs.ticket_key }}"
          fi

          # Build Jira links for PR body — one link per ticket
          TICKET_LINKS=""
          IFS=',' read -ra TKEYS <<< "$TICKET_DISPLAY"
          for TK in "${TKEYS[@]}"; do
            TK=$(echo "$TK" | xargs)
            TICKET_LINKS="$TICKET_LINKS [$TK](${{ secrets.JIRA_BASE_URL }}/browse/$TK)"
          done

          git commit -m "🤖 AI Fix Proposal [RUN-${{ github.run_id }}]

          Fixes for failing tests. Awaiting human approval.
          Jira Tickets: $TICKET_DISPLAY

          To approve: Run workflow_dispatch with 'approve-ai-fix'"

          git push origin "$BRANCH" || {
            echo "❌ First push failed, retrying..."
            sleep 2
            git push origin "$BRANCH"
          }

          PR_URL=$(gh pr create \
            --repo ${{ github.repository }} \
            --title "🤖 AI Fix: Run #${{ github.run_id }} | Tickets: $TICKET_DISPLAY" \
            --body "## AI-Generated Fix Proposal

          | Field | Value |
          |-------|-------|
          | **Jira Tickets** | $TICKET_LINKS |
          | **Run** | #${{ github.run_id }} |
          | **Status** | ⏳ Awaiting Approval |

          ### What Changed
          AI analyzed test failures and proposed code fixes.
          $REVIEW_NOTE

          ### How to Review
          1. Check **Files changed** tab
          2. Approve: Actions → Run workflow → **approve-ai-fix**
          3. Reject: Actions → Run workflow → **reject-ai-fix**

          ### On Approval
          - Auto-tests the fix
          - Merges if tests pass
          - Closes all Jira tickets on successful production deploy" \
            --base main \
            --head "$BRANCH")

          PR_NUM=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          echo "pr_number=$PR_NUM" >> $GITHUB_OUTPUT
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          echo "pr_branch=$BRANCH" >> $GITHUB_OUTPUT

      # ── Step 4: Email notification ────────────────────────────────
      - name: Send email notification
        if: steps.ai_fix.outputs.fix_created == 'true'
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          FROM_EMAIL: ${{ secrets.SMTP_USERNAME }}
          TO_EMAIL: ${{ secrets.SMTP_USERNAME }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          PR_URL: ${{ steps.create_pr.outputs.pr_url || 'N/A' }}
          TICKET_KEYS: ${{ steps.bug_report.outputs.ticket_keys }}
          TICKET_KEY: ${{ steps.bug_report.outputs.ticket_key }}
        run: |
          python -c "
          import smtplib, os, glob, json
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart

          ticket_keys_raw = os.getenv('TICKET_KEYS', '') or os.getenv('TICKET_KEY', '')
          all_tickets = [t.strip() for t in ticket_keys_raw.split(',') if t.strip()]
          jira_base = os.getenv('JIRA_BASE_URL', '')

          ticket_links = ' | '.join(
              f'<a href=\"{jira_base}/browse/{t}\">{t}</a>' for t in all_tickets
          ) or 'N/A'

          msg = MIMEMultipart('alternative')
          msg['Subject'] = f'🐛 Bug Reported + AI Fix Proposed — {ticket_keys_raw}'
          msg['From'] = os.getenv('FROM_EMAIL')
          msg['To'] = os.getenv('TO_EMAIL')

          html = f'''
          <html>
          <body style=\"font-family: Arial, sans-serif; line-height: 1.6; color: #333;\">
            <h2 style=\"color: #dc2626;\">🐛 Tests Failed — Bugs Reported</h2>
            <div style=\"background: #fee2e2; padding: 15px; border-radius: 8px; margin: 20px 0;\">
              <p><strong>Jira Tickets:</strong> {ticket_links}</p>
            </div>
            <h3 style=\"color: #4f46e5;\">🤖 AI Fix Proposal</h3>
            <p>An AI-generated fix has been proposed covering all {len(all_tickets)} bug(s).</p>
            <p><strong>PR:</strong> <a href=\"{os.getenv('PR_URL')}\">{os.getenv('PR_URL')}</a></p>
            <h3>Next Steps:</h3>
            <ol>
              <li>Review the PR code changes</li>
              <li>Approve or reject via GitHub Actions workflow_dispatch</li>
              <li>If approved: auto-tested, merged, and all tickets closed on deploy</li>
              <li>If rejected: manual fix required</li>
            </ol>
          </body>
          </html>
          '''
          msg.attach(MIMEText(html, 'html'))
          with smtplib.SMTP('smtp.gmail.com', 587) as s:
            s.starttls()
            s.login(os.getenv('SMTP_USERNAME'), os.getenv('SMTP_PASSWORD'))
            s.send_message(msg)
          print('📧 Notification sent to: ' + os.getenv('TO_EMAIL'))
          "

      - name: Update Jira — AI could not fix
        if: steps.ai_fix.outputs.fix_created == 'false' && steps.bug_report.outputs.ticket_key != '' && steps.bug_report.outputs.ticket_key != 'UNKNOWN'
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TICKET_KEYS: ${{ steps.bug_report.outputs.ticket_keys }}
          TICKET_KEY: ${{ steps.bug_report.outputs.ticket_key }}
        run: |
          ALL_TICKETS="${TICKET_KEYS:-$TICKET_KEY}"
          IFS=',' read -ra TKEYS <<< "$ALL_TICKETS"
          for TICKET in "${TKEYS[@]}"; do
            TICKET=$(echo "$TICKET" | xargs)
            echo "📝 Commenting on $TICKET..."
            curl -s -X POST \
              -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"body":"🤖 AI Fix Agent could not generate an automatic fix. Manual developer intervention required."}' \
              "$JIRA_BASE_URL/rest/api/2/issue/$TICKET/comment" || true
          done
          echo "📝 Jira updated on all tickets: Manual fix needed"

      - name: No valid ticket warning
        if: steps.bug_report.outputs.ticket_key == '' || steps.bug_report.outputs.ticket_key == 'UNKNOWN'
        run: |
          echo "⚠️ No valid JIRA ticket was created or exported."
          exit 0

  # ═════════════════════════════════════════════════════════════════
  # JOB 3: APPROVE AI FIX (Manual trigger)
  # Tests the fix branch, merges if all pass, then deploys and
  # closes ALL Jira tickets only after production is healthy.
  # ═════════════════════════════════════════════════════════════════
  approve-ai-fix:
    name: ✅ Approve & Merge AI Fix
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'approve-ai-fix'
    runs-on: ubuntu-latest
    outputs:
      tests_passed: ${{ steps.test_fix.outputs.passed }}
      all_tickets: ${{ steps.merge.outputs.all_tickets }}

    services:
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Find AI fix PR
        id: find_pr
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          PR_NUM=$(gh pr list --repo ${{ github.repository }} --search "AI Fix" --state open --json number --jq '.[0].number')
          PR_BRANCH=$(gh pr list --repo ${{ github.repository }} --search "AI Fix" --state open --json headRefName --jq '.[0].headRefName')
          echo "pr=$PR_NUM" >> $GITHUB_OUTPUT
          echo "branch=$PR_BRANCH" >> $GITHUB_OUTPUT
          echo "Found PR #$PR_NUM on branch $PR_BRANCH"

      - name: Checkout AI fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.find_pr.outputs.branch }}
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Setup ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Prepare directories
        run: mkdir -p artifacts/{screenshots,stacktraces,logs,bug_reports,ai_fixes}

      - name: Diagnose environment before starting Flask
        run: |
          echo "=== pwd / files ==="
          pwd && ls -la
          echo "=== templates ==="
          ls -la app/templates/ 2>/dev/null || echo "❌ No templates dir"
          echo "=== flask install ==="
          pip show flask || echo "❌ Flask not installed"
          echo "=== import test ==="
          python -c "import sys; sys.path.insert(0,'.'); import app.main" 2>&1 || echo "❌ Import failed"

      - name: Start Flask app
        run: |
          echo "=== Python version ==="
          python --version
          echo "=== Check app/main.py exists ==="
          ls -la app/main.py
          echo "=== Check templates ==="
          ls -la app/templates/ 2>/dev/null || echo "No templates dir"
          echo "=== Ensure port 5000 is free ==="
          fuser -k 5000/tcp 2>/dev/null || true
          pkill -f "python.*app/main.py" 2>/dev/null || true
          sleep 1
          echo "=== Start Flask ==="
          python -u app/main.py > flask.log 2>&1 &
          echo $! > flask.pid
          echo "FLASK_PID=$(cat flask.pid)" >> $GITHUB_ENV
          sleep 5
          echo "=== Check process ==="
          ps aux | grep -E "python.*main" | grep -v grep || echo "No main.py process"
          echo "=== Check logs ==="
          cat flask.log 2>/dev/null || echo "No log file"
          echo "=== Check port ==="
          ss -tlnp 2>/dev/null | grep 5000 || netstat -tlnp 2>/dev/null | grep 5000 || echo "Port 5000 not listening"

      - name: Wait for Flask healthy
        run: |
          for i in {1..30}; do
            HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:5000/health 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Flask ready"
              exit 0
            fi
            if ! kill -0 "$(cat flask.pid)" 2>/dev/null; then
              echo "❌ Flask process died while waiting for health check"
              cat flask.log
              exit 1
            fi
            echo "⏳ Waiting for Flask... ($i/30) - HTTP: $HTTP_CODE"
            sleep 1
          done
          echo "❌ Flask failed to become healthy in time"
          cat flask.log 2>/dev/null || true
          exit 1

      - name: Test the AI fix
        id: test_fix
        continue-on-error: true
        env:
          APP_URL: http://localhost:5000
          DISPLAY: ":99"
        run: |
          pytest tests/ -v --tb=short 2>&1 | tee ai_fix_test.txt

          FAILED=$(python3 -c "
          lines = open('ai_fix_test.txt').readlines()
          print(sum(1 for l in lines if l.startswith('FAILED ')))
          ")
          echo "failed_count=$FAILED" >> $GITHUB_OUTPUT

          if [ "$FAILED" = "0" ] && grep -q "passed" ai_fix_test.txt; then
            echo "passed=true" >> $GITHUB_OUTPUT
            echo "✅ All tests passed — AI fix is good"
          else
            echo "passed=false" >> $GITHUB_OUTPUT
            echo "❌ $FAILED test(s) still failing on AI fix branch"
          fi

      - name: Dump Flask log if tests failed
        if: steps.test_fix.outputs.passed == 'false'
        run: cat flask.log 2>/dev/null || echo "No Flask log found"

      - name: Cleanup Flask
        if: always()
        run: kill "$(cat flask.pid 2>/dev/null)" 2>/dev/null || true

      - name: Merge if tests pass
        id: merge
        if: steps.test_fix.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          PR_BODY=$(gh pr view ${{ steps.find_pr.outputs.pr }} --repo ${{ github.repository }} --json body --jq '.body')

          # Extract ALL ticket keys from PR body
          ALL_TICKETS=$(echo "$PR_BODY" | grep -oE '[A-Z]+-[0-9]+' | sort -u | tr '\n' ',' | sed 's/,$//')
          echo "all_tickets=$ALL_TICKETS" >> $GITHUB_OUTPUT
          echo "🎫 Tickets to close after deploy: $ALL_TICKETS"

          git config user.name "AI Fix Bot"
          git config user.email "ai-fix@bot.com"

          gh pr merge ${{ steps.find_pr.outputs.pr }} --repo ${{ github.repository }} --squash --delete-branch
          echo "✅ AI fix merged"

          # Comment on all tickets — full close happens after production deploy
          IFS=',' read -ra TKEYS <<< "$ALL_TICKETS"
          for TK in "${TKEYS[@]}"; do
            TK=$(echo "$TK" | xargs)
            curl -s -X POST \
              -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"body":"✅ AI Fix merged to main. Deploying to production — ticket will be closed on successful deploy."}' \
              "$JIRA_BASE_URL/rest/api/2/issue/$TK/comment" || true
          done

      - name: Close PR if tests fail
        if: steps.test_fix.outputs.passed == 'false'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          FAILED_COUNT: ${{ steps.test_fix.outputs.failed_count }}
        run: |
          PR_NUM=${{ steps.find_pr.outputs.pr }}
          gh pr comment $PR_NUM --repo ${{ github.repository }} \
            --body "❌ AI fix failed auto-tests (${FAILED_COUNT} still failing). Needs revision."

          PR_BODY=$(gh pr view $PR_NUM --repo ${{ github.repository }} --json body --jq '.body')
          ALL_TICKETS=$(echo "$PR_BODY" | grep -oE '[A-Z]+-[0-9]+' | sort -u | tr '\n' ',' | sed 's/,$//')

          IFS=',' read -ra TKEYS <<< "$ALL_TICKETS"
          for TK in "${TKEYS[@]}"; do
            TK=$(echo "$TK" | xargs)
            curl -s -X POST \
              -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"body\":\"❌ AI fix was approved but ${FAILED_COUNT} test(s) still failing. PR #${PR_NUM} needs revision.\"}" \
              "$JIRA_BASE_URL/rest/api/2/issue/$TK/comment" || true
          done

  # ═════════════════════════════════════════════════════════════════
  # JOB 4: DEPLOY AFTER AI FIX MERGE
  # Closes ALL Jira tickets only after production is confirmed healthy.
  # ═════════════════════════════════════════════════════════════════
  deploy-staging-after-ai-fix:
    name: 🚀 Deploy Staging (post AI fix)
    needs: approve-ai-fix
    if: needs.approve-ai-fix.outputs.tests_passed == 'true'
    runs-on: ubuntu-latest
    outputs:
      deploy_status: ${{ steps.verify.outputs.status }}

    steps:
      - name: Trigger Staging Deploy
        run: |
          echo "🚀 Deploying AI fix to STAGING..."
          curl -X POST "${{ secrets.RENDER_STAGING_DEPLOY_HOOK_URL }}"
          echo "✅ Triggered"

      - name: Wait for build
        run: sleep 45

      - name: Verify staging health
        id: verify
        run: |
          for i in {1..30}; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${{ secrets.RENDER_STAGING_URL }}/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "status=success" >> $GITHUB_OUTPUT
              echo "✅ Staging healthy"
              exit 0
            fi
            sleep 2
          done
          echo "status=failed" >> $GITHUB_OUTPUT
          echo "❌ Staging health check failed"

  deploy-production-after-ai-fix:
    name: 🌐 Promote to Production + Close Jira Tickets
    needs: [deploy-staging-after-ai-fix, approve-ai-fix]
    if: needs.deploy-staging-after-ai-fix.outputs.deploy_status == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Promote to production
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "✅ Production deploy triggered"

      - name: Wait and verify production
        run: |
          sleep 60
          for i in {1..30}; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${{ secrets.RENDER_APP_URL }}/health" || echo "000")
            if [ "$STATUS" = "200" ]; then echo "✅ Production healthy"; exit 0; fi
            sleep 2
          done
          echo "❌ Production health check failed" && exit 1

      # Close ALL Jira tickets now that production is confirmed healthy.
      # Look up the Done transition ID by name at runtime — hardcoded IDs
      # (like 31) vary per Jira project and can map to wrong statuses.
      - name: Close all Jira tickets — production confirmed healthy
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          ALL_TICKETS: ${{ needs.approve-ai-fix.outputs.all_tickets }}
        run: |
          echo "🎫 Closing tickets: $ALL_TICKETS"
          IFS=',' read -ra TKEYS <<< "$ALL_TICKETS"
          for TK in "${TKEYS[@]}"; do
            TK=$(echo "$TK" | xargs)
            echo "   Processing $TK..."

            # Add resolved comment
            curl -s -X POST \
              -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"body":"✅ RESOLVED — AI fix deployed to production and confirmed healthy. Closing ticket."}' \
              "$JIRA_BASE_URL/rest/api/2/issue/$TK/comment" || true

            # Look up the Done transition ID by name — never hardcode it
            DONE_ID=$(curl -s \
              -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
              -H "Content-Type: application/json" \
              "$JIRA_BASE_URL/rest/api/2/issue/$TK/transitions" \
              | python3 -c "
          import sys, json
          try:
              data = json.load(sys.stdin)
          except Exception as e:
              print('NOT_FOUND', file=sys.stderr)
              sys.exit(0)
          transitions = data.get('transitions', [])
          for name in ['Done', 'Resolved', 'Closed', 'done', 'resolved', 'closed']:
              for t in transitions:
                  if t.get('name', '').lower() == name.lower():
                      print(t['id'])
                      sys.exit(0)
          # Nothing matched — print available for debugging
          print('NOT_FOUND', file=sys.stderr)
          for t in transitions:
              print(f'  Available: id={t[\"id\"]} name={t[\"name\"]}', file=sys.stderr)
          " 2>/tmp/jira_debug_$TK.txt || echo "NOT_FOUND")

            if [ -f /tmp/jira_debug_$TK.txt ]; then
              cat /tmp/jira_debug_$TK.txt
            fi

            if [ -n "$DONE_ID" ] && [ "$DONE_ID" != "NOT_FOUND" ]; then
              curl -s -X POST \
                -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"transition\":{\"id\":\"$DONE_ID\"}}" \
                "$JIRA_BASE_URL/rest/api/2/issue/$TK/transitions" || true
              echo "   ✅ $TK → Done (transition id=$DONE_ID)"
            else
              echo "   ⚠️ Could not find Done/Resolved/Closed transition for $TK — see available transitions above"
            fi
          done
          echo "✅ All tickets processed: $ALL_TICKETS"

      - name: Notify production deploy success
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          FROM_EMAIL: ${{ secrets.SMTP_USERNAME }}
          ALL_TICKETS: ${{ needs.approve-ai-fix.outputs.all_tickets }}
          SMTP_SERVER: smtp.gmail.com
          SMTP_PORT: "587"
        run: |
          python3 -c "
          import os, smtplib
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText
          tickets = os.getenv('ALL_TICKETS', 'N/A')
          msg = MIMEMultipart('alternative')
          msg['Subject'] = f'✅ AI Fix Deployed & Tickets Closed — {tickets}'
          msg['From'] = os.getenv('FROM_EMAIL', os.getenv('SMTP_USERNAME'))
          msg['To'] = os.getenv('SMTP_USERNAME')
          html = f'''<html><body style=\"font-family:Arial,sans-serif;padding:20px;\">
            <h2 style=\"color:#16a34a;\">✅ AI Fix Successfully Deployed to Production</h2>
            <p><strong>Tickets closed:</strong> {tickets}</p>
            <p><strong>Status:</strong> DONE — Production confirmed healthy</p>
            <p>All tests passed, fix is live, Jira tickets are closed.</p>
            <p><strong>URL:</strong> ${{ secrets.RENDER_APP_URL }}</p>
          </body></html>'''
          msg.attach(MIMEText(html, 'html'))
          with smtplib.SMTP(os.getenv('SMTP_SERVER','smtp.gmail.com'), int(os.getenv('SMTP_PORT','587'))) as s:
            s.starttls()
            s.login(os.getenv('SMTP_USERNAME'), os.getenv('SMTP_PASSWORD'))
            s.send_message(msg)
          print('📧 Production deploy + ticket closure notification sent')
          " || echo "Email send failed, continuing"

  # ═════════════════════════════════════════════════════════════════
  # JOB 5: REJECT AI FIX (Manual trigger)
  # ═════════════════════════════════════════════════════════════════
  reject-ai-fix:
    name: ❌ Reject AI Fix
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'reject-ai-fix'
    runs-on: ubuntu-latest

    steps:
      - name: Close AI fix PR and update all tickets
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          PR_NUM=$(gh pr list --repo ${{ github.repository }} --search "AI Fix" --state open --json number --jq '.[0].number')
          PR_BODY=$(gh pr view $PR_NUM --repo ${{ github.repository }} --json body --jq '.body')
          ALL_TICKETS=$(echo "$PR_BODY" | grep -oE '[A-Z]+-[0-9]+' | sort -u | tr '\n' ',' | sed 's/,$//')

          gh pr close $PR_NUM --repo ${{ github.repository }} --comment "❌ Rejected by human reviewer. Manual fix required."

          IFS=',' read -ra TKEYS <<< "$ALL_TICKETS"
          for TK in "${TKEYS[@]}"; do
            TK=$(echo "$TK" | xargs)
            echo "📝 Commenting on $TK..."
            curl -s -X POST \
              -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"body":"🤖 AI fix rejected by human reviewer. Manual developer fix required."}' \
              "$JIRA_BASE_URL/rest/api/2/issue/$TK/comment" || true
          done

          echo "✅ AI fix rejected, all tickets ($ALL_TICKETS) updated"

  # ═════════════════════════════════════════════════════════════════
  # JOB 6: EMERGENCY ROLLBACK
  # ═════════════════════════════════════════════════════════════════
  rollback-production:
    name: 🚨 Emergency Rollback
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback-production'
    runs-on: ubuntu-latest

    steps:
      - name: Rollback production
        run: |
          echo "🚨 Rolling back to previous stable version..."
          echo "Rollback completed"
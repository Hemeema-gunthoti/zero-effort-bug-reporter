{% extends "base.html" %}

{% block title %}Items — Bug Reporter{% endblock %}

{% block content %}
<div class="page-header">
  <h1><i class="fas fa-box"></i> Products</h1>
  <p class="subtitle">Browse our inventory catalog</p>
</div>

<div class="items-grid">
  {% for id, item in items.items() %}
  <a href="/items/{{ id }}" class="item-card">
    <div class="item-card-header">
      <div class="item-avatar large">{{ item.name[0] }}</div>
      <div class="item-stock-badge {% if item.stock > 100 %}good{% elif item.stock > 50 %}warn{% else %}bad{% endif %}">
        {{ item.stock }} in stock
      </div>
    </div>
    <h3 class="item-card-title">{{ item.name }}</h3>
    <div class="item-card-price">${{ item.price }}</div>
    <div class="item-card-footer">
      <span class="btn-sm">View Details <i class="fas fa-arrow-right"></i></span>
    </div>
  </a>
  {% endfor %}
</div>
{% endblock %}

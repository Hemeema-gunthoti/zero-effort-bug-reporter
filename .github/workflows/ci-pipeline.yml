name: CI — Zero-Effort Bug Reporter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:    # allows manual trigger from GitHub UI

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      # ── 1. Checkout ───────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python setup ───────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Chrome + ChromeDriver ──────────────────────────────────
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      # ── 5. Artifact directories ───────────────────────────────────
      - name: Create artifact directories
        run: |
          mkdir -p artifacts/screenshots
          mkdir -p artifacts/stacktraces
          mkdir -p artifacts/logs
          mkdir -p artifacts/bug_reports

      # ── 6. Start Flask ────────────────────────────────────────────
      - name: Start Flask app
        run: python app/main.py &

      # ── 7. Wait for Flask to be ready ────────────────────────────
      - name: Wait for Flask
        run: |
          echo "Waiting for Flask..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:5000/health > /dev/null; then
              echo "✅ Flask is up"
              break
            fi
            echo "  attempt $i — waiting..."
            sleep 1
          done

      # ── 8. Run tests ──────────────────────────────────────────────
      # continue-on-error so pipeline keeps going after failures
      - name: Run test suite
        continue-on-error: true
        env:
          APP_URL: http://localhost:5000
          DISPLAY: ":99"
        run: |
          pytest tests/ -v --tb=short 2>&1 | tee test_output.txt

      # ── 9. Show captured artifacts ────────────────────────────────
      - name: Show captured artifacts
        if: always()
        run: |
          echo "=== Failure JSON files ==="
          ls -la artifacts/ || echo "empty"
          echo "=== Screenshots ==="
          ls -la artifacts/screenshots/ || echo "empty"
          echo "=== Stack traces ==="
          ls -la artifacts/stacktraces/ || echo "empty"

      # ── 10. Run AI agent + create Jira tickets ────────────────────
      - name: Run bug reporter agent
        if: always()
        env:
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL:          llama-3.3-70b-versatile
          JIRA_BASE_URL:       ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL:          ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN:      ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY:    ${{ secrets.JIRA_PROJECT_KEY }}
          JIRA_SEVERITY_FIELD: ${{ secrets.JIRA_SEVERITY_FIELD }}
          SMTP_SERVER:         smtp.gmail.com
          SMTP_PORT:           "587"
          SMTP_USERNAME:       ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD:       ${{ secrets.SMTP_PASSWORD }}
          FROM_EMAIL:          ${{ secrets.SMTP_USERNAME }}
          APP_URL:             http://localhost:5000
        run: python main.py

      # ── 11. Upload artifacts ──────────────────────────────────────
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ github.run_number }}
          path: |
            artifacts/
            test_output.txt
          retention-days: 30